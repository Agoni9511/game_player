server:
  port: 8080
spring:
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:mysql}
  servlet.multipart:
    max-file-size: 20MB
    max-request-size: 20MB
app.jwt:
  secret: ${JWT_SECRET:peiwan-platform-development-secret-key-change-before-production}
  access-minutes: 120
  refresh-days: 7
app.storage:
  type: ${STORAGE_TYPE:local}
  local:
    root: ${LOCAL_UPLOAD_ROOT:./data/uploads}
  cos:
    secret-id: ${COS_SECRET_ID:}
    secret-key: ${COS_SECRET_KEY:}
    bucket: ${COS_BUCKET:}
    region: ${COS_REGION:}
    public-base-url: ${COS_PUBLIC_BASE_URL:}
    prefix: ${COS_PREFIX:peiwan}
mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
  global-config:
    banner: false
    db-config:
      id-type: auto
