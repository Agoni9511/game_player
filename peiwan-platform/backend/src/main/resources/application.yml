server:
  port: 8080
spring:
  servlet.multipart:
    max-file-size: 20MB
    max-request-size: 20MB
  datasource:
    url: jdbc:h2:file:./data/peiwan;MODE=MySQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH
    username: sa
    password:
    driver-class-name: org.h2.Driver
  flyway.enabled: true
app.jwt:
  secret: ${JWT_SECRET:peiwan-platform-development-secret-key-change-before-production}
  access-minutes: 120
  refresh-days: 7
app.storage:
  local-root: ${LOCAL_UPLOAD_ROOT:./data/uploads}
mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
  global-config:
    banner: false
    db-config:
      id-type: auto
